## Apply oscillation parameter values:  Use with
#
# --override-files ${CONFIG_DIR}/overrides/MaCh3ComparisonFixedHeight.yaml
#
# Sets the oscillation weight calculation grid to compare with MaCh3 with
# a fixed production height. The binning is in the file name
# ./inputs/parameters/oscProb/ProdHeightDist_E300_cZ300_N1_hbin2.5.root"


fitterEngineConfig:
  likelihoodInterfaceConfig:

    dataSetList:
      - name: "FD"
        model:
          nominalWeightFormula:
            - "(isCC!=0||isNC!=0)? POTScaledWeight : 0.0"
            - "BeRPA_A_cvwgt * 0.59523810"

    propagatorConfig:

      parametersManagerConfig:
        parameterSetList:
          - name: "Oscillation Parameters"        
            isEnabled: true

            parameterDefinitions:
              - name: "PMNS_SIN_SQUARED_12"
                isFrozen: false
                #priorValue: 0.3073        # Nu-FIT 4.0 with SK atm: 0.303
                #parameterStepSize: 0.01
                #physicalLimits: [ 0.0, 1.0]
                #parameterLimits: [ 0.0, 1.0]    

              - name: "PMNS_SIN_SQUARED_13"
                isFrozen: false
                #priorValue: 0.0223      # Nu-FIT 4.0 with SK atm: 0.02225
                #parameterStepSize: 0.0007
                #physicalLimits: [ 0.0, 1.0]
                #parameterLimits: [ 0.0, 1.0 ]        

              - name: "PMNS_SIN_SQUARED_23"
                isFrozen: false
                #priorValue: 0.5799        # Nu-FIT 4.0 with SK atm: 0.451
                #parameterStepSize: 0.04
                #parameterLimits: [ 0.0, 1.0 ]
                #physicalLimits: [ 0.0, 1.0]
                
              - name: "PMNS_DELTA_MASS_SQUARED_21"
                isFrozen: false
                #priorValue: 7.39E-5      # Nu-FIT 4.0 with SK atm: 7.41E-5
                #parameterStepSize: 2.0e-6
                
              - name: "PMNS_DELTA_MASS_SQUARED_32"
                isFrozen: false
                #priorValue: 0.002451      # Nu-FIT 4.0 with SK atm: 2.51E-3
                #parameterStepSize: 2.6E-4
                #parameterLimits: [0.00245, 0.00255]

              - name: "PMNS_DELTA_CP"
                isFrozen: false
                #priorValue: -2.53  # Nu-FIT 4.0 with SK atm: -2.233
                #parameterStepSize: 1.0
                # PDG convention is [0.0, 6.28318530718] but DUNE uses this.
                #cyclicRange: [ -3.14159265359, 3.14159265359 ]
                #parameterLimits: [ -3.14159265359, 3.14159265359]

              - name: "PMNS_SIGN_MASS_SQUARED_32"
                isEnabled: true
                priorValue: 0.5
                isFixed: true                

          
          - name: "Flux Systematics"
            isEnabled: false
         #   parameterDefinitionFilePath: "./inputs/parameters/flux/fd_flux_covariance_DUNE_systs_2023.root"
         #   covarianceMatrix: xsec_cov

          - name: "Cross-Section Systematics"
            isEnabled: false
          #  parameterDefinitionFilePath: "./inputs/parameters/xsec/fd_xsec_covariance_only_DUNE_systs_2023.root"
          #  covarianceMatrixTMatrixD: xsec_cov                 

          - name: "Flux Cross-Section Systematics"
            isEnabled: true
            enableThrowToyParameters: false
            parameterDefinitionFilePath: "./inputs/parameters/xsec/flux_xsec_covariance_DUNE_inclNDcontr_200MW.root"
            covarianceMatrixTMatrixD: xsec_cov
            parameterNameList: xsec_param_names
            parameterPriorValueList: xsec_param_prior
            parameterLowerBoundsList: xsec_param_lb
            parameterUpperBoundsList: xsec_param_ub
            printDialSetSummary: true          


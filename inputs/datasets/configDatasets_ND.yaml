- name: "ND"
  isEnabled: true

  showSelectedEventCount: true

# Debug Options
  devSingleThreadEventSelection: false
  devSingleThreadEventLoaderAndIndexer: false

  #selectedDataEntry: "data-FD" # default
  
  model:

    #additionalLeavesStorage: 
      #- "mcMode"
      #- "isCC"
      #- "mcEnu"
      #- "mcGenWeight"
      #- "recoEnu_numu"
      #- "recoEnu_nue"

    # common tree name where the data are stored in each file
    tree: "event_tree"

    # MC files
    filePathList:

      - "${ND_INPUTS}/ndlar_selected_MicroProdN4p1_NDComplex_FHC.caf.full.spineonly.root"

    # base weight
    nominalWeightFormula:
      - "mcGenWeight"

  data:

    - name: "data-ND"
    
      tree: "event_tree"

      # MC files
      filePathList:
        - "${ND_INPUTS}/ndlar_selected_MicroProdN4p1_NDComplex_FHC.caf.full.spineonly.root"

      # base weight
      nominalWeightFormula:
        - "mcGenWeight"

